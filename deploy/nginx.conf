# Every tenant sub-domain (acme.localhost, globex.localhost, admin.localhost …) is served by this
# one virtual host: the build is identical for all tenants; the API resolves the tenant.
upstream api {
  # Docker DNS returns every replica of the `api` service; nginx balances across them.
  server api:3000 max_fails=3 fail_timeout=5s;
  keepalive 32;
}

server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location /api/ {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # Keep the original Host: the API cross-checks the sub-domain with the token's tenant.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    client_max_body_size 200k;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
